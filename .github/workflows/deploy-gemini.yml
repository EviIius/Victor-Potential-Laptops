name: Set up Gemini chat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "site/assets/scoring.mjs"
      - ".github/workflows/deploy-gemini.yml"

permissions:
  contents: read

concurrency:
  group: deploy-gemini
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node site/test_app.cjs
      - run: node --test workers/test_worker.mjs

  deploy:
    needs: test
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHAT_CODE: ${{ secrets.CHAT_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          assert all(os.environ.get(k) for k in ('CF_TOKEN', 'GEMINI_KEY', 'CHAT_CODE')), 'Add the three required repository secrets. See workers/README.md.'
          assert 16 <= len(os.environ['CHAT_CODE']) <= 512, 'The chat access code must have 16–512 characters.'
          PY
      - name: Deploy secure Gemini backend
        id: worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          secrets: |
            GEMINI_API_KEY
            CHAT_ACCESS_TOKEN
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHAT_ACCESS_TOKEN: ${{ secrets.CHAT_ACCESS_TOKEN }}
      - name: Connect the website to the backend
        env:
          WORKER_URL: ${{ steps.worker.outputs.deployment-url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          from urllib.parse import urlsplit
          base = os.environ['WORKER_URL'].rstrip('/')
          url = urlsplit(base)
          assert url.scheme == 'https' and url.hostname.endswith('.workers.dev'), 'Worker deployment did not return a workers.dev URL.'
          for attempt in range(8):
              try:
                  with urllib.request.urlopen(base + '/health', timeout=15) as r:
                      assert json.load(r)['ready'], 'Worker secrets or rate limiter are missing.'
                  break
              except Exception:
                  if attempt == 7:
                      raise
                  time.sleep(5)
          with open('site/data/chat-config.json', 'w') as f:
              json.dump({'endpoint': base + '/chat'}, f, indent=2)
              f.write('\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Gemini backend is ready. The website is publishing at https://eviiius.github.io/Victor-Potential-Laptops/#chat.\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/chat-config.json
          if ! git diff --cached --quiet; then
            git commit -m "Connect Gemini chat backend"
            git pull --rebase origin main
            git push
          fi
      - name: Publish the connected chat without re-scraping prices
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scrape.yml --ref main --field publish_only=true
